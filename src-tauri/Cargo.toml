[package]
name = "openyoke"
version = "0.1.0"
edition = "2021"
description = "A private, local-first desktop app for chatting with open-source AI models via Ollama, with branching conversations shown as an interactive graph."
license = "MIT"
readme = "../README.md"
keywords = ["ollama", "llm", "local-first", "ai", "tauri"]
categories = ["gui"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
regex = "1"
